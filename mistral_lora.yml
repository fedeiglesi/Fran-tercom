base_model: mistralai/Mistral-7B-Instruct-v0.3
model_type: MistralForCausalLM
tokenizer_type: LlamaTokenizer
is_llama_derived_model: true
load_in_8bit: false
load_in_4bit: false
strict: false
push_dataset_to_hub:
dataset:
  - path: data/fran_100k.jsonl
    type: jsonl
    conversation_template: mistral
val_set_size: 0.01
output_dir: ./mistral-fran-lora
sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true
wandb_project:
wandb_watch:
wandb_name:
wandb_log_model:
gradient_accumulation_steps: 4
micro_batch_size: 2
gradient_checkpointing: true
early_stopping_patience:
resume_from_checkpoint:
logging_steps: 100
save_steps: 500
eval_steps: 500
num_epochs: 1
learning_rate: 2e-4
train_on_inputs: false
group_by_length: false
bf16: auto
fp16: false
tf32: false
warmup_steps: 100
logging_first_step: true
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM
