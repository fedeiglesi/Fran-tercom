# ACT baseline (LeRobot 0.6.x) sized for CPU training on the Mac Studio / this container.
policy: act
dataset: level1_cube_scripted_v001       # data/datasets/<this>
image_key: observation.images.oakd_sim
state_key: observation.state
action_key: action
act:
  chunk_size: 20
  n_action_steps: 10
  vision_backbone: resnet18
  pretrained_backbone_weights: null       # no ImageNet download needed (offline); set "ResNet18_Weights.IMAGENET1K_V1" when online
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  kl_weight: 10.0
  dropout: 0.1
  temporal_ensemble_coeff: null
training:
  steps: 6000
  batch_size: 32
  lr: 1.0e-4
  lr_backbone: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 10.0
  num_workers: 2
  log_every: 100
  save_every: 2000
  seed: 1
  device: cpu
  image_augmentation: true       # brightness jitter only; pixel shift disabled for a fixed camera (see train.py)
  image_shift_pad: 0
  image_brightness: 0.1
