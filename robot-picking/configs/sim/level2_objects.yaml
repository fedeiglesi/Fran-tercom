# Level 2: 10 simple objects (one per episode, chosen at random), 4 colours, boxes/cylinders/sphere.
name: level2_objects
sim: {timestep: 0.002, control_hz: 10, max_steps: 150, gl_backend: auto}
robot:
  name: mycobot_280_m5
  tcp_offset: [0.0, 0.0, 0.065]
  home_joints_deg: [21.0, 0.2, -96.8, 6.7, 0.0, -69.0]
  gripper_max_opening: 0.045
  gripper_pad_friction: 2.0
  actuator_kp: 100.0
  gravity_compensation: true
  joint_damping: 1.5
camera:
  name: oakd_sim
  width: 640
  height: 480
  fovy_deg: 55.0
  position: [0.52, 0.0, 0.40]
  lookat: [0.18, 0.0, 0.02]
  policy_crop: [96, 60, 544, 420]
  policy_image_size: [128, 128]
scene:
  table_size: [0.5, 0.5, 0.02]
  table_color: [0.85, 0.85, 0.82, 1]
  one_object_per_episode: true
  parking_position: [-0.35, 0.0, 0.05]     # out of the camera view and of the workspace
  tray: {position: [0.14, -0.14, 0.0], inner_size: [0.08, 0.08], wall_height: 0.015, wall_thickness: 0.004, color: [0.2, 0.3, 0.8, 1]}
  objects:
    - {id: red_cube,        name: red cube,        color_name: red,    type: box,      size: [0.0125, 0.0125, 0.0125], mass: 0.03, color: [0.9, 0.1, 0.1, 1], position: [0.18, 0.09, 0.0125], friction: 1.0}
    - {id: green_cube,      name: green cube,      color_name: green,  type: box,      size: [0.010, 0.010, 0.010],    mass: 0.02, color: [0.1, 0.8, 0.1, 1], position: [0.18, 0.09, 0.010],  friction: 1.0}
    - {id: blue_cube,       name: blue cube,       color_name: blue,   type: box,      size: [0.015, 0.015, 0.015],    mass: 0.05, color: [0.1, 0.2, 0.9, 1], position: [0.18, 0.09, 0.015],  friction: 1.0}
    - {id: yellow_box,      name: yellow box,      color_name: yellow, type: box,      size: [0.020, 0.010, 0.0075],   mass: 0.03, color: [0.95, 0.85, 0.1, 1], position: [0.18, 0.09, 0.0075], friction: 1.0}
    - {id: red_flat_box,    name: red flat box,    color_name: red,    type: box,      size: [0.015, 0.015, 0.006],    mass: 0.03, color: [0.9, 0.1, 0.1, 1], position: [0.18, 0.09, 0.006],  friction: 1.0}
    - {id: green_cylinder,  name: green cylinder,  color_name: green,  type: cylinder, size: [0.012, 0.015],           mass: 0.04, color: [0.1, 0.8, 0.1, 1], position: [0.18, 0.09, 0.015],  friction: 1.0}
    - {id: blue_cylinder,   name: blue cylinder,   color_name: blue,   type: cylinder, size: [0.010, 0.010],           mass: 0.03, color: [0.1, 0.2, 0.9, 1], position: [0.18, 0.09, 0.010],  friction: 1.0}
    - {id: yellow_puck,     name: yellow puck,     color_name: yellow, type: cylinder, size: [0.014, 0.006],           mass: 0.03, color: [0.95, 0.85, 0.1, 1], position: [0.18, 0.09, 0.006],  friction: 1.0}
    - {id: red_sphere,      name: red sphere,      color_name: red,    type: sphere,   size: [0.012],                  mass: 0.03, color: [0.9, 0.1, 0.1, 1], position: [0.18, 0.09, 0.012],  friction: 1.2}
    - {id: green_tall_box,  name: green tall box,  color_name: green,  type: box,      size: [0.010, 0.020, 0.020],    mass: 0.04, color: [0.1, 0.8, 0.1, 1], position: [0.18, 0.09, 0.020],  friction: 1.0}
task:
  instruction_template: "Pick the {name} and place it in the blue tray."
  instruction: "Pick the object and place it in the blue tray."
  target_object: random
  destination: tray
  lift_height: 0.05
randomization:
  enabled: true
  object_xy_range: [0.03, 0.03]
  object_yaw_range_deg: 45.0
  object_mass_range: [0.02, 0.06]
  object_friction_range: [0.8, 1.3]
  camera_pos_noise: 0.0
  camera_rot_noise_deg: 0.0
  light_noise: 0.0
  color_noise: 0.0
